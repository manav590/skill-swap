<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skill Swap - Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="signup-container">
    <h2>Skill Swap Dashboard</h2>
    <div id="userList"></div>
  </div>

  <script>
    async function fetchUsers() {
      const response = await fetch('http://localhost:3000/api/users');
      const users = await response.json();

      const listContainer = document.getElementById('userList');
      listContainer.innerHTML = '';

      users.forEach(user => {
        const div = document.createElement('div');
        div.classList.add('user-card');
        div.innerHTML = `
          <h3>${user.name}</h3>
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>Skills:</strong> ${user.skills}</p>
          <button onclick="requestSkill(${user.id}, '${user.skills}')">Request Skill</button>

        `;
        listContainer.appendChild(div);
      });
    }
    async function requestSkill(toUserId, skill) {
        const fromUserId = 1; // TEMP: hardcoded user ID of logged-in user (we'll fix later)

        const response = await fetch('http://localhost:3000/api/request', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fromUserId, toUserId, skillRequested: skill })
        });

        const result = await response.json();
        alert(result.message);
    }

    fetchUsers();
  </script>
</body>
</html>
