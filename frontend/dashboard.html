<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skill Swap - Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="signup-container">
    <h2>Skill Swap Dashboard</h2>
    <div id="userList"></div>
  </div>

  <script>
    const currentUserId = 1;

    async function fetchUsers() {
      const response = await fetch('http://localhost:3000/api/users');
      const users = await response.json();

      const listContainer = document.getElementById('userList');
      listContainer.innerHTML = '';

      users.forEach(user => {
        if (user.id === currentUserId) return;

        const div = document.createElement('div');
        div.classList.add('user-card');
        const encodedSkill = encodeURIComponent(user.skills);
        div.innerHTML = `
          <h3>${user.name}</h3>
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>Skills:</strong> ${user.skills}</p>
          <button onclick="requestSkill(${user.id}, '${encodedSkill}')">Request Skill</button>
        `;
        listContainer.appendChild(div);
      });
    }

    async function requestSkill(toUserId, skillEncoded) {
      const skill = decodeURIComponent(skillEncoded);

      const response = await fetch('http://localhost:3000/api/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          from_user_id: currentUserId,
          to_user_id: toUserId,
          skill_requested: skill
        })
      });

      const data = await response.json();
      alert(data.message);
    }

    fetchUsers();
  </script>

</body>
</html>
